<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Cole Snipes — Full Stack &amp; Data Engineer</title>
  <meta name="description" content="Full stack and data engineer in Indianapolis. I build clean interfaces and the data pipelines behind them — accreditation tooling, WebAssembly, and ML pipelines." />
  <link rel="canonical" href="https://colesnipes.dev/" />
  <meta name="theme-color" content="#F5F0E8" />

  <!-- Icons. favicon.ico sits at the site root so the browser's automatic
       /favicon.ico probe resolves without a network round trip to the SPA fallback. -->
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="icon" sizes="any" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />

  <!-- Open Graph / Twitter. og:image must be an absolute URL: LinkedIn, Slack and
       iMessage all fetch it out-of-band with no page context to resolve against. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Cole Snipes" />
  <meta property="og:url" content="https://colesnipes.dev/" />
  <meta property="og:title" content="Cole Snipes — Full Stack &amp; Data Engineer" />
  <meta property="og:description" content="Full stack and data engineer in Indianapolis. I build clean interfaces and the data pipelines behind them." />
  <meta property="og:image" content="https://colesnipes.dev/assets/og-cover.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Cole Snipes — full stack and data engineer, Indianapolis." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Cole Snipes — Full Stack &amp; Data Engineer" />
  <meta name="twitter:description" content="Full stack and data engineer in Indianapolis. I build clean interfaces and the data pipelines behind them." />
  <meta name="twitter:image" content="https://colesnipes.dev/assets/og-cover.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Only three faces are actually used: Cormorant Light upright (every serif
       rule sets font-weight 300), Cormorant Light italic (.project-title), and
       Space Mono Regular (body). Cormorant 400, Cormorant italic 400 and Space
       Mono 700 were being downloaded and never rendered — there is no bold or
       weight-400 text anywhere in the stylesheet or the markup. -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Space+Mono&display=swap" rel="stylesheet" />

  <!-- schema.org Person. This is the only machine-readable identity on a
       client-rendered page, so it carries the facts crawlers cannot get from an
       empty #root: name, role, location, and the canonical profile links. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Cole Snipes",
    "url": "https://colesnipes.dev/",
    "jobTitle": "Full Stack & Data Engineer",
    "email": "mailto:cole.snipes@icloud.com",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Indianapolis",
      "addressRegion": "IN",
      "addressCountry": "US"
    },
    "alumniOf": {
      "@type": "CollegeOrUniversity",
      "name": "University of Indianapolis"
    },
    "knowsAbout": [
      "Full Stack Development",
      "Data Engineering",
      "Machine Learning",
      "Python",
      "React",
      "SvelteKit",
      "WebAssembly"
    ],
    "sameAs": [
      "https://github.com/c4snipes",
      "https://www.linkedin.com/in/cole-snipes/"
    ]
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>
    <p style="font-family: monospace; padding: 2rem; max-width: 60ch;">
      Cole Snipes — full stack and data engineer in Indianapolis. This portfolio needs
      JavaScript to render. You can reach me at
      <a href="mailto:cole.snipes@icloud.com">cole.snipes@icloud.com</a>, or see
      <a href="https://github.com/c4snipes">github.com/c4snipes</a> and
      <a href="https://www.linkedin.com/in/cole-snipes/">linkedin.com/in/cole-snipes</a>.
    </p>
  </noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
